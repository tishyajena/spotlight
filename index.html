<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight · Discover and register for events</title>
  <meta name="description" content="Spotlight is a responsive event platform to discover upcoming events, view details and register in seconds.">
  <meta name="theme-color" content="#6d5dfc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%23ff4d8d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var t = localStorage.getItem('spotlight-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a href="#/" class="logo" aria-label="Spotlight home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Spotlight</span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/events" data-nav="events">Events</a>
        <a href="#/registrations" data-nav="registrations">
          My Registrations <span class="count-badge" id="regCount" hidden>0</span>
        </a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a href="#/" class="logo"><span class="logo-mark" aria-hidden="true"></span><span>Spotlight</span></a>
        <p class="muted small">Discover events worth showing up for. Built with HTML5, CSS3 and vanilla JavaScript.</p>
      </div>
      <div class="footer-links">
        <a href="#/events">Browse events</a>
        <a href="#/registrations">My registrations</a>
        <button type="button" class="link-btn" data-action="toggle-theme">Switch theme</button>
      </div>
    </div>
    <div class="container footer-bottom small muted">© <span id="year"></span> Spotlight. Made for K Explore, Web Designing.</div>
  </footer>

  <!-- Reusable modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-close" type="button" data-close aria-label="Close dialog">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
